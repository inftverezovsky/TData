name: Temporary TI 2026 naked thrones verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify count and T4 timeline
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          LEAGUE_ID = 19719
          START = 1786579200
          END = 1787529600
          T4_MASK = (1 << 9) | (1 << 10)
          MATCH_ID = 8955549026

          def get_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "TI2026-verifier/3.0", "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return json.loads(r.read().decode("utf-8"))

          sql = f"""
              SELECT m.match_id, m.start_time, m.duration, m.radiant_win,
                     m.radiant_score, m.dire_score,
                     m.tower_status_radiant, m.tower_status_dire,
                     m.radiant_team_id, m.dire_team_id,
                     rt.name AS radiant_name, dt.name AS dire_name,
                     m.series_id
              FROM matches m
              LEFT JOIN teams rt ON rt.team_id = m.radiant_team_id
              LEFT JOIN teams dt ON dt.team_id = m.dire_team_id
              WHERE m.leagueid = {LEAGUE_ID}
                AND m.start_time >= {START}
                AND m.start_time < {END}
              ORDER BY m.start_time, m.match_id
          """
          url = "https://api.opendota.com/api/explorer?" + urllib.parse.urlencode({"sql": sql})
          rows = get_json(url).get("rows", [])
          complete = [r for r in rows if r.get("tower_status_radiant") is not None and r.get("tower_status_dire") is not None]
          candidates = [
              r for r in complete
              if (int(r["tower_status_radiant"]) & T4_MASK) == 0
              and (int(r["tower_status_dire"]) & T4_MASK) == 0
          ]

          detail = get_json(f"https://api.opendota.com/api/matches/{MATCH_ID}")
          tower4_events = []
          for obj in detail.get("objectives") or []:
              key = str(obj.get("key") or "")
              if "tower4" in key.lower():
                  tower4_events.append(obj)

          result = {
              "coverage": len(complete),
              "count": len(candidates),
              "candidates": candidates,
              "match": {
                  "match_id": MATCH_ID,
                  "radiant": (detail.get("radiant_team") or {}).get("name"),
                  "dire": (detail.get("dire_team") or {}).get("name"),
                  "radiant_win": detail.get("radiant_win"),
                  "radiant_score": detail.get("radiant_score"),
                  "dire_score": detail.get("dire_score"),
                  "duration": detail.get("duration"),
                  "tower_status_radiant": detail.get("tower_status_radiant"),
                  "tower_status_dire": detail.get("tower_status_dire"),
              },
              "tower4_events": tower4_events,
              "all_objective_types": sorted({str(x.get("type")) for x in (detail.get("objectives") or [])}),
          }
          print("RESULT_BEGIN")
          print(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True))
          print("RESULT_END")
          if len(complete) != 147 or len(candidates) != 1:
              raise SystemExit(f"Unexpected result: coverage={len(complete)} count={len(candidates)}")
          PY

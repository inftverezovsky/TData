name: Project quality

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tdata_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tdata_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/tdata_test_ci?schema=public
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/tdata_test_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Static checks and unit tests
        run: npm run check
      - name: Deployment safety scenarios without Docker or SSH
        run: |
          bash -n scripts/deploy/remote-redeploy.sh
          for scenario in success foreign port configport configimage migration backup upfail healthfail wrongimage rollbackfail; do
            bash tests/fixtures/deployment/remote-harness.sh "$scenario" "$GITHUB_WORKSPACE/scripts/deploy/remote-redeploy.sh"
          done
      - name: Migrate isolated CI database
        run: npm run db:migrate:deploy
      - name: Database integration tests
        run: npm run test:integration
      - name: Enforce TLine coverage
        run: npm run test:tline:coverage
      - name: Enforce normalizer coverage
        run: npm run test:normalizers:coverage
      - name: Enforce frontend model coverage
        run: npm run test:frontend:coverage
      - name: Seed isolated CI database for browser scenarios
        run: npm run db:seed
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser tests
        run: npm run test:e2e:prod
      - name: FIxt delivery against local mock API
        run: npm run test:e2e:db
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7

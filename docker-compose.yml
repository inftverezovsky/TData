name: tdata

services:
  postgres:
    image: postgres:16
    container_name: tdata-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-tdata}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - tdata_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: tdata-web
    restart: always
    ports:
      - "3010:3010"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tdata}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-tdata}?schema=public
      LIQUIPEDIA_USER_AGENT: ${LIQUIPEDIA_USER_AGENT:?LIQUIPEDIA_USER_AGENT is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      TCYBER_INSTANCE_ID: ${TCYBER_INSTANCE_ID:-docker-local}
      TCYBER_SYNC_PEER_URL: ${TCYBER_SYNC_PEER_URL:-}
      TCYBER_SYNC_TOKEN: ${TCYBER_SYNC_TOKEN:-}
      TCYBER_SYNC_TIMEOUT_MS: ${TCYBER_SYNC_TIMEOUT_MS:-60000}
      LIQUIPEDIA_GENERIC_MIN_INTERVAL_MS: ${LIQUIPEDIA_GENERIC_MIN_INTERVAL_MS:-2100}
      LIQUIPEDIA_PARSE_MIN_INTERVAL_MS: ${LIQUIPEDIA_PARSE_MIN_INTERVAL_MS:-31000}
      LIQUIPEDIA_JITTER_MS: ${LIQUIPEDIA_JITTER_MS:-650}
      LIQUIPEDIA_COOLDOWN_MS: ${LIQUIPEDIA_COOLDOWN_MS:-600000}
      LIQUIPEDIA_SEARCH_VARIATION_LIMIT: ${LIQUIPEDIA_SEARCH_VARIATION_LIMIT:-5}
      LIQUIPEDIA_SEARCH_FULLTEXT_VARIATION_LIMIT: ${LIQUIPEDIA_SEARCH_FULLTEXT_VARIATION_LIMIT:-2}
      LIQUIPEDIA_SEARCH_TIME_BUDGET_MS: ${LIQUIPEDIA_SEARCH_TIME_BUDGET_MS:-45000}
      LIQUIPEDIA_SEARCH_API_TIMEOUT_MS: ${LIQUIPEDIA_SEARCH_API_TIMEOUT_MS:-7000}
      LIQUIPEDIA_SEARCH_API_MAX_RETRIES: ${LIQUIPEDIA_SEARCH_API_MAX_RETRIES:-0}
      LIQUIPEDIA_IMPORT_API_TIMEOUT_MS: ${LIQUIPEDIA_IMPORT_API_TIMEOUT_MS:-12000}
      LIQUIPEDIA_IMPORT_API_MAX_RETRIES: ${LIQUIPEDIA_IMPORT_API_MAX_RETRIES:-0}
      LIQUIPEDIA_DIRECT_FALLBACK_ENABLED: ${LIQUIPEDIA_DIRECT_FALLBACK_ENABLED:-1}
      LIQUIPEDIA_SKIP_PARSED_HTML: ${LIQUIPEDIA_SKIP_PARSED_HTML:-1}
      LIQUIPEDIA_SUBPAGE_CONCURRENCY: ${LIQUIPEDIA_SUBPAGE_CONCURRENCY:-3}
      HLTV_SEARCH_TIMEOUT_MS: ${HLTV_SEARCH_TIMEOUT_MS:-30000}
      HLTV_SEARCH_RESULT_WAIT_MS: ${HLTV_SEARCH_RESULT_WAIT_MS:-12000}
      HLTV_SEARCH_MAX_ATTEMPTS: ${HLTV_SEARCH_MAX_ATTEMPTS:-1}
      HLTV_ALLOW_DIRECT_FALLBACK: ${HLTV_ALLOW_DIRECT_FALLBACK:-1}
      HLTV_QUEUE_DELAY_MS: ${HLTV_QUEUE_DELAY_MS:-1000}
      PROXY_AUTO_SEED_URLS: ${PROXY_AUTO_SEED_URLS:-}
      PORT: 3010
      ADMIN_UPLOAD_ALLOWED_HOSTS: ${ADMIN_UPLOAD_ALLOWED_HOSTS:?ADMIN_UPLOAD_ALLOWED_HOSTS is required}
      ADMIN_UPLOAD_ALLOW_INSECURE_HTTP: ${ADMIN_UPLOAD_ALLOW_INSECURE_HTTP:-0}
      ADMIN_UPLOAD_ALLOW_PRIVATE_HOSTS: ${ADMIN_UPLOAD_ALLOW_PRIVATE_HOSTS:-0}
      ADMIN_UPLOAD_ALLOW_ANY_PUBLIC_HOST: ${ADMIN_UPLOAD_ALLOW_ANY_PUBLIC_HOST:-0}
      ADMIN_AUTH_ALLOW_NONE: ${ADMIN_AUTH_ALLOW_NONE:-}
      ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE:-none}
      ADMIN_BASIC_USERNAME: ${ADMIN_BASIC_USERNAME:-}
      ADMIN_BASIC_PASSWORD: ${ADMIN_BASIC_PASSWORD:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      ADMIN_API_KEY_HEADER: ${ADMIN_API_KEY_HEADER:-x-api-key}
      ADMIN_API_KEY_VALUE: ${ADMIN_API_KEY_VALUE:-}
      TCYBER_PUBLIC_BASE_URL: ${TCYBER_PUBLIC_BASE_URL:-}
      ARCCODEX_API_KEY: ${ARCCODEX_API_KEY:-}
      CRON_PROXY_CHECK_SECRET: ${CRON_PROXY_CHECK_SECRET:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
      IDENTITY_SYNC_INCLUDE_API_URL: ${IDENTITY_SYNC_INCLUDE_API_URL:-0}
    volumes:
      - ./certs:/app/certs:ro
      - tdata_cache:/app/cache
      - tdata_tesseract_cache:/app/.tesseract-cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 3010) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  tdata_postgres_data:
  tdata_cache:
  tdata_tesseract_cache:
